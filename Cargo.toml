[workspace]
members = ["crates/*", "apps/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
authors = ["Your Name <YourName@yourdomain.com>"]
edition = "2024"
license = "MIT"
documentation = "https://docs.rs/"
repository = "https://github.com/TODO"
homepage = "https://github.com/TODO"
readme = "README.md"

[workspace.dependencies]
clap = { version = "~4.6.7", features = ["derive"] }
reqwest = { version = "~0.13.5", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "~0.23.45", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "~1.0.229", features = ["derive"] }
serde_json = "~1.0.151"
thiserror = "~2.0.21"
tokio = { version = "~1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

# workspace crates
jev-core = { path = "crates/core" }
