name: build

on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-rust:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    # services:
    #   postgres:
    #     image: postgres:14.5
    #     env:
    #       POSTGRES_PASSWORD: postgres
    #     ports:
    #       - 5432:5432
    #     # Set health checks to wait until postgres has started
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Rust
        run: |
          rustup toolchain install 1.98.1 --component llvm-tools-preview --component clippy --component rustfmt
          rustup toolchain install nightly --component rustfmt
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: install nextest
        uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
      # - name: Install Protoc
      #   uses: arduino/setup-protoc@v2
      - name: Check code format
        run: cargo +nightly fmt --all -- --check
      - name: Check the package for errors
        run: cargo check --workspace --locked
      - name: Lint rust sources
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Execute rust tests
        run: cargo nextest run --workspace --all-features --locked --test-threads 1
      - name: Execute documentation tests
        run: cargo test --doc --workspace --all-features --locked
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        if: startsWith(github.ref, 'refs/tags/')
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body: ${{ steps.git-cliff.outputs.content }}
